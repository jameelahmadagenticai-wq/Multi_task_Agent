version: 1
disable_existing_loggers: false
formatters:
  json:
    format: '{"time":"%(asctime)s","level":"%(levelname)s","service":"%(name)s","message":"%(message)s"}'
handlers:
  console:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stdout
root:
  level: INFO
  handlers:
    - console
