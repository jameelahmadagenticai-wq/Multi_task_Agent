global:
  scrape_interval: 15s

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8000"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: ollama
    static_configs:
      - targets: ["ollama:11434"]
