services:
  ollama:
    image: ollama/ollama
    container_name: ai_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    mem_limit: 16g
    restart: unless-stopped
    networks:
      - aiagent_net

  qdrant:
    image: qdrant/qdrant
    container_name: ai_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    mem_limit: 4g
    restart: unless-stopped
    networks:
      - aiagent_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_postgres
    environment:
      POSTGRES_USER: aiagent
      POSTGRES_PASSWORD: aiagent
      POSTGRES_DB: aiagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - aiagent_net

  redis:
    image: redis:7
    container_name: ai_redis
    ports:
      - "6379:6379"
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - aiagent_net

  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ai_fastapi
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_HOST: qdrant
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - ollama
      - qdrant
      - postgres
      - redis
    ports:
      - "8000:8000"
    mem_limit: 4g
    restart: unless-stopped
    networks:
      - aiagent_net

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: ai_streamlit
    environment:
      API_BASE_URL: http://fastapi:8000
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - aiagent_net

  prometheus:
    image: prom/prometheus
    container_name: ai_prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - aiagent_net

  grafana:
    image: grafana/grafana
    container_name: ai_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - aiagent_net

  loki:
    image: grafana/loki
    container_name: ai_loki
    volumes:
      - ../monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
    command:
      - "-config.file=/etc/loki/config.yaml"
    restart: unless-stopped
    networks:
      - aiagent_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: ai_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - aiagent_net

networks:
  aiagent_net:
    driver: bridge

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  grafana_data:
